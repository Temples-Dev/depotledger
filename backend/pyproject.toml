[project]
name = "depotledger-backend"
version = "0.1.0"
description = "depotledger backend: Django + DRF modular monolith."
requires-python = ">=3.13"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F405"]
"apps/*/migrations/*.py" = ["E501"]
